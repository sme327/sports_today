[shape]
headline = "Two 13-5 teams, and the Texans' defence measures elite against both the pass and the run while the Bills have lost the back who carried their 97th-percentile run game."
observations = [
  { lead = "Houston's defence is the best measured unit on the slate.", text = "16.7 points allowed a game (100th percentile), the toughest run defence by own-baseline (−14 against form) and the third-toughest pass defence (−37). Josh Allen and James Cook both carry a measured struggle call against it." },
  { lead = "James Cook is gone, and with him 20 carries a game.", text = "Buffalo ran for 155 yards a game (97th percentile) with Cook at 20.4 carries; he is not on the roster. Ray Davis (5.5) and Ty Johnson (questionable, hamstring) are the backs the feed knows. DJ Moore arrived from Chicago with 6.1 targets a game. Joe Brady coaches the Bills." },
  { lead = "Buffalo's run defence is the softest by own-baseline; its pass defence is fifth-toughest.", text = "Backs gained about 10 yards on their form against Buffalo (32nd of 32); passers lost 33 (5th). Houston's backfield is Woody Marks (14.8 carries), Jawhar Jordan and David Montgomery, arrived from Detroit with 11 carries a game." },
  { lead = "Stroud into the Bills' pass defence is the mirror of Allen into Houston's.", text = "Stroud threw 33.6 times a game for 221; Nico Collins drew 8.1 targets. Tank Dell and Jayden Higgins are on injured reserve, so the Houston passing game is Collins and Dalton Schultz." },
]
alternative = "The other shape: Allen's 36 attempts a game find Shakir, Moore and Kincaid against a Texans pass rush that has to respect his legs, Buffalo's 28 points a game holds up, and Houston's run game is the one that cannot keep pace in 90-degree heat."

