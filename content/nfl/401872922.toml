  { lead = "Cleveland's offence is the worst profile on the slate.", text = "16.4 points a game (6th percentile), 4.3 yards a play (3rd), 185 passing yards (6th). Shedeur Sanders threw 29 times a game in his starts; Joe Flacco is gone and Dillon Gabriel is on injured reserve. Deshaun Watson is on the roster. Todd Monken coaches." },
  { lead = "Jacksonville's backfield is rebuilt.", text = "Travis Etienne (18.2 carries) and Tank Bigsby are gone; Bhayshul Tuten, Chris Rodriguez (9.7 a game in Washington) and LeQuint Allen (questionable, hip) share it. Lawrence's targets are spread five wide: Washington, Meyers, Hunter, Thomas, Strange." },
  { lead = "The Jaguars' run defence allowed the fewest yards in the league.", text = "85 rushing yards a game, 100th percentile, 6th-toughest by own-baseline. Quinshon Judkins carried 19 times a game for the Browns and this is his hardest matchup of the season on paper." },
