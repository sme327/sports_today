# --- Tonight's shape: a human read for this game, written before any market line was
# consulted. Description of the two rosters and the February template, not a forecast.
[shape]
headline = "A run-leaning, field-position game between two elite defences, with both backfields missing their explosive back."
observations = [
  { lead = "Defence and the run won it for Seattle in February.", text = "29-13 with six sacks of Maye, three takeaways, 32 rushes for 141 yards and 33 minutes of possession. Darnold threw for 5.3 yards an attempt; the offence was not the reason." },
  { lead = "Both teams want to run, into top-seven run defences.", text = "The Patriots threw on 52% of snaps in 2025 and the Seahawks on 50%, and by the engine's own-baseline rating each run defence is among the seven toughest in the league." },
  { lead = "Darnold faces the tougher pass defence.", text = "New England's rates 8th toughest of 32, costing a passer about 21 yards against his own form. Seattle's rates average: its low raw yards allowed came from facing 35 attempts a game from trailing offences. Darnold's last three starts of 2025 went 147, 198 and 202." },
  { lead = "New England rebuilt the interior and the receiver room.", text = "The line was rebuilt after the six-sack night, and Brown and Doubs are a real upgrade on Diggs, a part-time player by December. Seattle's rookie lead back has never taken an NFL snap." },
]
alternative = "The other shape: Brown and Doubs against a secondary missing its nickel and a starting safety, Maye over 280 yards, and a total in the high 40s."

