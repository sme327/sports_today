[shape]
headline = "The Lions' elite offence against a Saints defence that is average, while the Lions' own secondary is missing both starting safeties on a pass defence already rated 30th."
observations = [
  { lead = "Detroit's offence is the second-best profile on the Sunday slate.", text = "28.3 points a game (94th percentile), 6.0 yards a play (94th), 269 passing yards a game (94th). Goff threw 35 times for 293 a game over his last ten; St. Brown drew 10.3 targets, Jameson Williams cleared 60 yards in 8 of 10." },
  { lead = "The Lions are without Brian Branch and Kerby Joseph.", text = "Both starting safeties are out, on a pass defence that already gave up about 26 yards against form by own-baseline (30th of 32). The Saints' passing game, 69th percentile, is the one part of their offence that rated above average." },
  { lead = "New Orleans is thin at running back and unsettled at quarterback.", text = "Kamara is questionable with an MCL sprain, Audric Estimé is out and Devin Neal is gone; Kendre Miller is the healthy back. Tyler Shough (238 a game) and Spencer Rattler both started in 2025 and Zach Wilson arrived." },
  { lead = "Gibbs has the Detroit backfield to himself.", text = "David Montgomery signed with Houston and Isiah Pacheco, brought in to replace him, is on injured reserve. Gibbs carried 19.8 times a game already; Montgomery's 11 touches have nowhere else to go." },
]
alternative = "The other shape: Kamara plays, Shough finds Olave against a safety-less secondary, and the Saints keep it within a score into the fourth quarter on possession rather than points."

[read]
game_script = "Detroit scores. The question is whether New Orleans can throw enough to stay attached, and the answer depends on a Lions secondary missing both safeties. Expect Gibbs to carry a heavier load than his 2025 average and the Saints to throw more than a 6-11 team would like to."

