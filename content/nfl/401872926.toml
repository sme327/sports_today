[shape]
headline = "Jacoby Brissett's 37 attempts a game into the fourth-toughest pass defence by own-baseline, with both of Arizona's top backs on injured reserve and Kyler Murray in Minnesota."
observations = [
  { lead = "Arizona's offence is Brissett throwing to McBride, Wilson and Harrison.", text = "Brissett threw 37.4 times a game for 277 in his starts; Trey McBride drew 9.9 targets, Michael Wilson 7.4, Marvin Harrison Jr. 6.1. Kyler Murray is in Minnesota. Mike LaFleur coaches the Cardinals." },
  { lead = "The Chargers' defence is the fourth-toughest against the pass and fifth against the run.", text = "Passers lost about 34 yards against form facing Los Angeles; backs lost 9. The Chargers allowed 19.8 points a game (78th percentile). Jim Harbaugh coaches the Chargers." },
  { lead = "Arizona has no run game and no healthy lead back.", text = "93 rushing yards a game (6th percentile); James Conner and Trey Benson are on injured reserve, Jeremiyah Love is questionable, Tyler Allgeier arrived from Atlanta with 9.4 carries a game and Bam Knight had 11.3." },
  { lead = "Herbert's yards fell to 197 a game over his last ten.", text = "37 attempts a game, so the volume held; Keenan Allen (7.2 targets) has gone to Indianapolis and David Njoku arrived. Omarion Hampton (16.0) and Kimani Vidal (14.7) share the carries." },
]
alternative = "The other shape: Brissett's volume beats the measurement the way it beat an average defence all last season, McBride has a 10-target day, and the Cardinals' 88th-percentile passing game keeps a 3-14 team in a game the Chargers' offence (21 a game) cannot run away from."

[read]
game_script = "Chargers control. A defence measured in the top five both ways against an offence with one healthy dimension is a field-position game the home side wins on possessions. Expect Brissett to throw 40 times for fewer yards than that implies, and Hampton and Vidal to close it out."

