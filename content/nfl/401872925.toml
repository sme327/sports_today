game_script = "Points. Both defences gave up 24 to 29 a game and the two things each offence does best run into the other's weakness: Burrow into a pass defence rated last by own-baseline, Irving into a run defence in the bottom five. Expect the Bengals to throw first and Tampa Bay to run first, and the total to be the market that moves."

