[shape]
headline = "A healthy Burrow against the pass defence that gave up the most against form in the league last season, and a Bengals run defence that invites Bucky Irving."
observations = [
  { lead = "Burrow is back, and Tampa Bay's pass defence rates last of 32.", text = "By the engine's own-baseline measure passers gained about 30 yards on their form against the Buccaneers in 2025, the worst mark in the league. Burrow threw for 226 a game in the eight games he played; Flacco and Browning covered the rest of a 6-11 season." },
  { lead = "Cincinnati's run defence is the softer half of a weak unit.", text = "The Bengals allowed 28.9 points a game (9th percentile) and 147 rushing yards (3rd). Irving carried 20.8 times a game as the lead back; Rachaad White has left for Washington, so the backfield is his." },
  { lead = "Tampa Bay's receiver room is rebuilt around Egbuka and Godwin.", text = "Mike Evans is in San Francisco and Jalen McMillan is doubtful with a knee, so Mayfield's 35 attempts a game go to Emeka Egbuka (7.6 targets), Chris Godwin and Cade Otton." },
  { lead = "Ja'Marr Chase's volume does not depend on who is throwing.", text = "10.8 targets a game across three quarterbacks in 2025, 94 yards a game over his last ten. Tee Higgins was 6.5 targets. Chase Brown carried 18.8 times behind them." },
]
alternative = "The other shape: Tampa Bay's run defence, second-toughest by own-baseline, holds Chase Brown down and the Bengals' pass rush without Shemar Stewart (doubtful) never gets to Mayfield; it becomes Irving against a 3rd-percentile run defence all afternoon."

