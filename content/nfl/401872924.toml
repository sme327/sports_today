  { lead = "Neither team could throw in 2025, and both defences suppress passing.", text = "The Jets averaged 164 passing yards a game (3rd percentile), the Titans 191 (12th). By own-baseline the Jets' pass defence cost passers 22 yards against form (7th toughest) and the Titans' 27 (6th). Everything about this game points at the run." },
  { lead = "Geno Smith is the Jets' quarterback now.", text = "32.6 attempts a game in Las Vegas last season. Justin Fields went to Kansas City and Brady Cook to Miami. Breece Hall carried 18.2 times a game behind a run game at the 70th percentile." },
  { lead = "Tennessee's second year under Cam Ward, with Robert Saleh coaching.", text = "Ward threw 34 times a game; Tony Pollard carried 16.6. Wan'Dale Robinson arrived from the Giants with 8.9 targets a game, more than any Titans receiver had. Chig Okonkwo is gone." },
  { lead = "The Titans' run defence is the weak seam.", text = "25th of 32 by own-baseline, 115 yards allowed a game; Hall's 65 yards a game over his last ten meets it. The Jets' run defence rates average." },
]
alternative = "The other shape: Geno Smith's arrival is the difference, the Jets throw on a Titans secondary that lost bodies to injured reserve, and Garrett Wilson has the day the numbers do not promise."

