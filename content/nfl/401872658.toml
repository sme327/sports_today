[shape]
headline = "Atlanta on its third quarterback of the summer with Penix and Tagovailoa both out, against a Steelers defence that rated soft both ways by own-baseline, which we measure to mean nothing."
observations = [
  { lead = "Cooper Rush starts for the Falcons.", text = "Penix is inactive for Week 1 and Tagovailoa is out with an oblique injury. Rush's two Baltimore starts in 2025 produced 20 and 19 attempts; his eight Dallas starts in 2024 ranged from 23 to 55. Relief averages cannot set today's workload. Saturday reporting described back spasms, with Rush still expected to start." },
  { lead = "Bijan Robinson is the plan, with help behind him.", text = "86.9 rushing yards per game in the 2025 regular season and 72 or more in 11 of 17 appearances. Brian Robinson Jr. is the new backup, so Allgeier's departure does not hand Bijan every vacated carry." },
  { lead = "Pittsburgh's defence rated soft by own-baseline on both sides.", text = "28th against the pass (+17), 29th against the run. The project's measurement is that a soft defence does not lift a player above his form, so this is not a reason to expect a Falcons explosion; it is a reason not to expect suppression." },
  { lead = "Rodgers has more mouths to feed.", text = "31.1 attempts and 20.4 completions per appearance in the 2025 regular season. Michael Pittman Jr. joins Metcalf and Roman Wilson at receiver; Warren and newcomer Dowdle share the backfield. Those new allocations matter more than carrying each arrival's old-team average forward." },
]
alternative = "Rush sustains drives through London, Pitts and Bijan, forcing Pittsburgh to keep throwing. That would challenge the low-scoring script. A precipitation chance alone is not evidence of game-time rain or passing suppression."

[read]
game_script = "A measured start, with Atlanta leaning on Bijan and short throws while Rush settles in. London and Pitts are both targets on the depth chart. Pittsburgh can distribute short completions among a deeper receiving group, but a Warren-Dowdle split makes individual rushing volume uncertain. An early Pittsburgh lead could force Atlanta above its preferred passing volume. September 13 review: the original preline notes below contained incorrect Pitts-departure and unsupported rain assumptions; they remain visible as the original read, superseded by this analysis and the prop board."

[[preline]]
team = "Atlanta Falcons"
player = "Bijan Robinson"
market = "Rush attempts"
direction = "over"
why = "22.9 touches a game, Allgeier gone, a backup quarterback and rain. Every arrow points at volume."

[[preline]]
team = "Atlanta Falcons"
player = "Cooper Rush"
market = "Passing yards"
direction = "under"
why = "14 attempts a game in relief last season; the Falcons will not ask a third-string quarterback to throw 35 times in the rain."

[[preline]]
team = "Pittsburgh Steelers"
player = "Jaylen Warren"
market = "Rush attempts"
direction = "avoid"
why = "Rico Dowdle (16.3 a game in Carolina) arrived to split the work; the share is unknown until we see it."

[[preline]]
team = "Atlanta Falcons"
player = "Drake London"
market = "Receptions"
direction = "over"
why = "9.3 targets a game, and with Pitts and Mooney gone the share only concentrates. The passer is the risk, not the role."

