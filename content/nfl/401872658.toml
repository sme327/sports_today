[shape]
headline = "Atlanta on its third quarterback of the summer with Penix and Tagovailoa both out, against a Steelers defence that rated soft both ways by own-baseline, which we measure to mean nothing."
observations = [
  { lead = "Cooper Rush starts for the Falcons.", text = "Michael Penix Jr. is out after ACL surgery and Tua Tagovailoa, signed from Miami, is out with an oblique strain. Rush threw 14 times a game in relief in Baltimore last season. Kevin Stefanski coaches Atlanta." },
  { lead = "Bijan Robinson is the plan.", text = "22.9 touches a game in 2025, 93 rushing yards a game over his last ten, Tyler Allgeier now in Arizona. The Falcons' run game rated 78th percentile; the Steelers' run defence gave up about 8 yards against form, 29th of 32." },
  { lead = "Pittsburgh's defence rated soft by own-baseline on both sides.", text = "28th against the pass (+17), 29th against the run. The project's measurement is that a soft defence does not lift a player above his form, so this is not a reason to expect a Falcons explosion; it is a reason not to expect suppression." },
  { lead = "Rodgers, in his second Pittsburgh season, with a rebuilt supporting cast.", text = "32.5 attempts a game; Rico Dowdle arrived from Carolina with 16.3 carries a game to pair with Jaylen Warren, and Metcalf (6.6 targets) is the number one after MVS, Austin and Jonnu Smith left. Mike McCarthy coaches the Steelers." },
]
alternative = "The other shape: Rush is fine, London and Bijan carry a simple plan against a defence that rated soft, and a rainy Pittsburgh afternoon (24% precipitation) keeps both totals low regardless."

[read]
game_script = "Grind. A third-string quarterback and rain argue for Atlanta running Bijan into a 29th-ranked run defence and asking little of Rush; Pittsburgh's defence can afford that. Rodgers against an average Falcons pass defence (21st) decides whether the Steelers pull away."

