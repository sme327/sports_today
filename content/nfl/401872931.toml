  { lead = "Bo Nix threw 41 times a game and carries a measured struggle call.", text = "237 yards a game against a Chiefs pass defence costing passers 19 against form. Jaylen Waddle arrived from Miami with 6.4 targets to join Sutton (7.3) and Franklin (6.4); J.K. Dobbins (16.7) and RJ Harvey (12.1) split the carries." },
