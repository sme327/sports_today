[shape]
headline = "A 12-6 Bears team with the league's best turnover margin runs into a Carolina pass defence that rated second-most suppressive by own-baseline, while the Panthers are missing both starting tackles."
observations = [
  { lead = "Chicago's profile is strong everywhere the Panthers' is weak.", text = "26.2 points (75th percentile), 141 rushing yards (94th), 242 passing (78th), and a +1.1 turnover margin, the best in the league. Carolina scored 19 a game (19th) and its offence rated below the 40th percentile in every column." },
  { lead = "Carolina's pass defence is the real obstacle.", text = "Passers lost about 48 yards against their form facing the Panthers in 2025, second-toughest of 32 by own-baseline. Caleb Williams threw 38.8 times a game for 239; this is the largest measured suppression on the Sunday slate." },
  { lead = "The Panthers are without both starting tackles.", text = "Ikem Ekwonu and Taylor Moton are out, and Tershawn Wharton is out on the interior. Bryce Young threw 33.8 times a game behind a line that is now two backups wide." },
  { lead = "Both backfields changed hands.", text = "Rico Dowdle (16.3 carries a game) left Carolina for Pittsburgh, leaving Chuba Hubbard; D'Andre Swift (16.8) and Kyle Monangai (11.7) split Chicago's. DJ Moore is in Buffalo and Rome Odunze is questionable with a calf." },
]
alternative = "The other shape: Carolina's pass defence does what it did all last season to Williams, the Bears lean on Swift and Monangai against a 24th-ranked run defence, and the game is decided by the turnover margin the Bears led the league in."

