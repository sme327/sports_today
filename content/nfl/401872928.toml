[shape]
headline = "Two rebuilt offences: Miami with three new quarterbacks and none of last season's receivers, Las Vegas with Kirk Cousins and without Brock Bowers."
observations = [
  { lead = "Miami's passing game is new from the quarterback out.", text = "Tua Tagovailoa (Atlanta), Quinn Ewers (Jacksonville), Tyreek Hill, Jaylen Waddle (Denver) and Darren Waller (Carolina) are all gone. Brady Cook (33 attempts a game with the Jets), Kyle McCord and Malik Willis are the quarterbacks on the roster; the feed cannot say who starts. Jeff Hafley coaches the Dolphins." },
  { lead = "De'Von Achane is the one constant.", text = "20.2 touches a game and 96 rushing yards over his last ten, in a run game at the 66th percentile, against a Raiders run defence rated average by own-baseline (23rd)." },
  { lead = "The Raiders' offence was the worst in the league and is now Cousins'.", text = "14.2 points a game (3rd percentile), 77.5 rushing yards (3rd). Kirk Cousins arrived from Atlanta with 28 attempts a game; Geno Smith went to the Jets, Jakobi Meyers to Jacksonville. Ashton Jeanty carried 19.9 times a game. Klint Kubiak calls the offence as head coach." },
  { lead = "Brock Bowers is out.", text = "Meniscus surgery removes the Raiders' most-targeted player (7.3 a game). Tre Tucker (6.1) and Michael Mayer are what remains; the Raiders' pass defence rates 11th by own-baseline (−15), the better half of their defence." },
]
alternative = "The other shape: Cousins and Jeanty are enough against a Miami defence that allowed 25 a game and rated soft against the pass, and the Raiders' home opener is the higher-scoring, more competent side of an ugly game."

[read]
game_script = "Ugly and low. Two offences that scored 20 and 14 a game, both rebuilt, neither with a settled passing game; the running backs, Achane and Jeanty, are the only players whose roles are certain. Expect the total to sit low and the first team to string two scoring drives together to win."

