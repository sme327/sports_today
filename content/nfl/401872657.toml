# --- Tonight's matchup: the story of the game, written before any line was posted.
[shape]
headline = "The league's best offence, with a rebuilt defence, against a 49ers side that scored 26 twice on it last season and has two new receivers to do it again."
observations = [
  { lead = "The Rams' offence is the best profile on the page.", text = "30.7 points a game in 2025, 97th percentile in yards a play and passing yards, 89th in turnover margin. Stafford threw 35.5 times a game for 278; Nacua averaged 10.8 targets and 107 yards. They scored 42 on San Francisco in November." },
  { lead = "San Francisco already knows how to move the ball on them.", text = "Two meetings in 2025: 342 and 319 passing yards and 26 points each time, a road win in October, both with Mac Jones at quarterback. Their pass offence rated 84th percentile against a Rams pass defence at 41st, and that defence has changed at corner, not at safety." },
  { lead = "The Rams' bet is that the front changes everything.", text = "Garrett, McDuffie and Donald arrived for exactly this problem. But Donald is not on the plane, Garrett did not practise Tuesday, and Watson, the corner opposite McDuffie, has a toe. The rebuilt front is at partial strength on the first night." },
  { lead = "San Francisco's own questions are at tight end and in the trenches.", text = "Kittle and Bosa both return from surgery on snap counts; Pearsall, Kirk and Guerendo are out for the season. The 49ers ran 63 plays a game and threw on 56%, with McCaffrey the most-targeted back in the league at 7.6 a game." },
]
alternative = "The other shape: Garrett is whole, Watson plays, and the front that was built for this game turns Purdy's 2025 sack rate into a February-style night for the 49ers."

# --- The read's expected script (hand-written).
[read]
game_script = "A game with points in it. Both offences threw on more than half their snaps last season and both defences allowed 6.8 yards an attempt; the Rams have the better profile in every ranked column but third down, and the 49ers have the recent evidence of scoring on them. Expect the Rams to lead on possessions that end in points and San Francisco to keep it a one-score game through McCaffrey's touches and a short passing game while Kittle is limited."

