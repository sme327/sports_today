[shape]
headline = "The best passing offence in the league against a Giants pass defence that rates average, on a Dallas defence that allowed the third-most points and rated 31st against the pass, with Malik Nabers questionable off an ACL."
observations = [
  { lead = "Dallas threw for 279 yards a game, 100th percentile.", text = "Prescott attempted 38.4 a game for 267; CeeDee Lamb drew 9.1 targets and George Pickens 8.1 and each cleared his bar in 7 of 10. Javonte Williams carried 18.9 times; Blue, Sanders and Mafah are gone, Emari Demercado arrived." },
  { lead = "The Cowboys' defence gave up 30.1 points a game.", text = "3rd percentile, and passers gained about 27 yards on their form against it, 31st of 32 by own-baseline. Jaxson Dart threw 30 times a game as a rookie." },
  { lead = "Nabers is questionable in his return from ACL surgery.", text = "8.8 targets a game when he played. Wan'Dale Robinson (8.9) has gone to Tennessee, so the Giants' targets are Nabers if he plays, Darnell Mooney and Isaiah Likely, both new. John Harbaugh coaches the Giants." },
  { lead = "The Giants' backfield is Skattebo, Tracy and now Najee Harris.", text = "Skattebo 16.6 touches, Tracy 14.9, Harris arrived from the Chargers. The Cowboys' run defence rates average (15th), the Giants' rush defence 6th percentile in yards allowed." },
]
alternative = "The other shape: Harbaugh's Giants run Skattebo and Harris at a 6th-percentile Dallas run defence, keep Prescott on the sideline, and a 4-13 team makes the opener a 24-21 game instead of the shootout the profiles promise."

