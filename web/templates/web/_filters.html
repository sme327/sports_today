{% if filter_groups %}
<section class="analytics-filters" aria-label="Filters">
  {% for group in filter_groups %}
  <div class="analytics-filter-group">
    <span class="filter-label">{{ group.label }}</span>
    <div class="filter-pills">
      {% for option in group.options %}
      <a class="filter-pill {% if option.active %}active{% endif %}" href="{{ option.href }}">{{ option.label }}</a>
      {% endfor %}
    </div>
  </div>
  {% endfor %}
</section>
{% endif %}
