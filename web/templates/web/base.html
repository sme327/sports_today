{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A calm guide to today's games and explainable player opportunities.">
  <title>{% block title %}Sports Today{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'app.css' %}?v=20260815-2">
  <link rel="stylesheet" href="{% static 'web.css' %}?v=20260815-2">
  <script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.10/dist/htmx.min.js" integrity="sha384-H5SrcfygHmAuTDZphMHqBJLc3FhssKjG7w/CeCpFReSfwBWDTKpkzPP8c+cLsK+V" crossorigin="anonymous" defer></script>
  <script src="{% static 'static-site.js' %}?v=20260815-2" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="site-brand" href="/">
      <span class="site-brand-name">Sports <b>Today</b></span>
      <span class="site-date">{% if slate_date %}{{ slate_date|date:"l, F j" }}{% else %}{% now "l, F j" %}{% endif %}</span>
    </a>
    <nav class="compact-nav" aria-label="Main navigation">
      <span class="nav-day-toggle">
        <a class="{% if day != 'tomorrow' %}{% if section == 'today' or not section %}active{% endif %}{% endif %}" href="/?day=today">Today</a>
        <a class="{% if day == 'tomorrow' %}active{% endif %}" href="/?day=tomorrow">Tomorrow</a>
      </span>
      <a class="performance-link {% if section == 'performance' %}active{% endif %}" href="{% url 'performance' %}">Performance</a>
    </nav>
  </header>
  <main class="site-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">Sports Today · explainable signals, honest uncertainty</footer>
</body>
</html>
